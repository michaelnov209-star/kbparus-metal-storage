name: Post-deploy Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact Vercel deployment URL
        required: true
        type: string
      production:
        description: Validate as canonical production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      MANUAL_PRODUCTION: ${{ inputs.production }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run non-destructive deployment smoke
        shell: bash
        run: |
          node scripts/cms/validate-deployment.mjs "$DEPLOYMENT_URL"
          if [[ "${DEPLOYMENT_ENVIRONMENT,,}" == "production" || "$MANUAL_PRODUCTION" == "true" ]]; then
            node scripts/cms/validate-deployment.mjs \
              "https://kbparus-metal-storage.vercel.app" \
              --production
          fi
