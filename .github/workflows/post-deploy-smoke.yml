name: Post-deploy Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact Vercel deployment URL
        required: true
        type: string
      production:
        description: Validate as canonical production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      MANUAL_PRODUCTION: ${{ inputs.production }}
      # Protected Preview is deliberately skipped: passing a Vercel bypass
      # secret to code checked out from an untrusted branch would expose it.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use project Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Run non-destructive deployment smoke
        shell: bash
        run: |
          node scripts/cms/validate-deployment.mjs "$DEPLOYMENT_URL"
          if [[ "${DEPLOYMENT_ENVIRONMENT,,}" == "production" || "$MANUAL_PRODUCTION" == "true" ]]; then
            node scripts/cms/validate-deployment.mjs \
              "https://kbparus-metal-storage.vercel.app" \
              --production
          fi
